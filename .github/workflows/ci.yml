name: Validate source data and infrastructure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run generator tests
        run: python -m unittest discover -s tests -v
      - name: Generate full source data
        run: python -m src.generate_healthcare_data --output data/generated
      - name: Verify manifest exists
        run: test -s data/generated/manifest.json

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate S3 Terraform
        run: |
          terraform -chdir=infra/terraform/s3 init -backend=false
          terraform -chdir=infra/terraform/s3 validate
      - name: Validate EC2 Airflow Terraform
        run: |
          terraform -chdir=infra/terraform/ec2-airflow init -backend=false
          terraform -chdir=infra/terraform/ec2-airflow validate
      - name: Validate composite platform Terraform
        run: |
          terraform -chdir=infra/terraform/platform init -backend=false
          terraform -chdir=infra/terraform/platform validate

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render Airflow Compose configuration
        run: docker compose --env-file airflow/.env.example -f airflow/docker-compose.ec2.yaml config --quiet
